name: CI + Release with SonarCloud

on:
  push:
    branches:
      - develop
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Required for tags & Sonar

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Build, Test & SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify

  release:
    name: Release on master
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Needed for git tag push & version bump

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Maven Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Strip -SNAPSHOT if present
          BASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          mvn versions:set -DnewVersion=$BASE_VERSION
          git commit -am 'Release version v$BASE_VERSION.'
          git tag "v${BASE_VERSION}"
          git push origin master --follow-tags
          git push origin tag "v$BASE_VERSION"

      - name: Bump develop to next SNAPSHOT
        run: |
          git checkout develop
          git pull origin develop
          git merge master --no-ff -m "Merge master after release v$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          # Increment patch version for develop
          mvn build-helper:parse-version versions:set -DnextSnapshot -e -X
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          git commit -am "Bump develop to next snapshot $CURRENT_VERSION"
          git push origin develop
